# =============================================================================
# EcoCycle - Pipeline CI/CD
#
#   build-test ──> compose-e2e ──> publish-image ──> deploy-staging ──> deploy-production
#   (Maven +       (docker compose   (GHCR, tag       (environment:      (environment:
#    Oracle real)   up + smoke)       sha-<commit>)    staging + smoke)   production,
#                                                                          aprovacao manual)
#
# - Pull requests executam apenas build-test e compose-e2e.
# - Push na main executa tudo. Os deploys so rodam quando a variavel de repositorio
#   DEPLOY_ENABLED = 'true' (infra configurada). Sem ela os jobs aparecem como "skipped",
#   nunca como deploy falso.
# - Nenhum segredo fica neste arquivo: tudo vem de GitHub Secrets/Variables.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Em PR cancela execucoes antigas; na main nunca interrompe um deploy em andamento
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: ecocycle

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build + testes (unitarios + integracao contra Oracle real)
  # ---------------------------------------------------------------------------
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Oracle descartavel, existe apenas durante este job e so e acessivel pelo runner
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Ora${{ github.run_id }}Ci
          APP_USER: ecocycle
          APP_USER_PASSWORD: Db${{ github.run_id }}Ci
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      # Credenciais efemeras (geradas por execucao) do banco descartavel de CI
      DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      DB_USERNAME: ecocycle
      DB_PASSWORD: Db${{ github.run_id }}Ci
      APP_SECURITY_USERNAME: ci-user
      APP_SECURITY_PASSWORD: Api${{ github.run_id }}Ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }} (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Permissao de execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Build (compilacao)
        run: ./mvnw -B -ntp clean compile

      - name: Testes (unitarios + integracao com Oracle)
        run: ./mvnw -B -ntp test

      - name: Empacotar JAR
        run: ./mvnw -B -ntp package -DskipTests

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              v = [int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped')]
              tot = [a + b for a, b in zip(tot, v)]
              rows.append(f"| {r.get('name').split('.')[-1]} | {v[0]} | {v[1]} | {v[2]} | {v[3]} |")
          print('## Resultado dos testes\n')
          print('| Classe | Testes | Falhas | Erros | Ignorados |\n|---|---|---|---|---|')
          print('\n'.join(rows))
          print(f'| **Total** | **{tot[0]}** | **{tot[1]}** | **{tot[2]}** | **{tot[3]}** |')
          EOF

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ecocycle-jar
          path: target/ecocycle-*.jar

  # ---------------------------------------------------------------------------
  # 2) Docker Compose ponta a ponta: build da imagem + Oracle + smoke test CRUD
  # ---------------------------------------------------------------------------
  compose-e2e:
    name: Docker Compose (app + Oracle) e smoke test
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar .env efemero
        run: |
          umask 077
          cat > .env <<EOF
          APP_PORT=8080
          APP_ENVIRONMENT=ci
          APP_IMAGE=ecocycle-api:ci
          APP_SECURITY_USERNAME=ci-user
          APP_SECURITY_PASSWORD=Api${GITHUB_RUN_ID}Ci
          ORACLE_PASSWORD=Ora${GITHUB_RUN_ID}Ci
          DB_USERNAME=ecocycle
          DB_PASSWORD=Db${GITHUB_RUN_ID}Ci
          EOF

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Subir stack (build da imagem a partir do codigo-fonte)
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Estado dos containers, rede e volume
        run: |
          docker compose ps
          docker network ls --filter name=ecocycle
          docker volume ls --filter name=ecocycle

      - name: Smoke test (health + seguranca + CRUD)
        env:
          APP_SECURITY_USERNAME: ci-user
          APP_SECURITY_PASSWORD: Api${{ github.run_id }}Ci
        run: bash ./scripts/smoke-test.sh http://localhost:8080

      - name: Evidencia do Flyway
        run: docker compose logs app | grep -iE 'flyway|migrat|Successfully applied' || true

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3) Imagem Docker multi-arquitetura no GitHub Container Registry
  # ---------------------------------------------------------------------------
  publish-image:
    name: Publicar imagem (GHCR)
    needs: [build-test, compose-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Referencia imutavel da imagem
        id: ref
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: QEMU (build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "## Imagem publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Aviso quando a infraestrutura de deploy ainda nao foi configurada
  # ---------------------------------------------------------------------------
  deploy-disabled:
    name: Deploy desabilitado (infra nao configurada)
    needs: publish-image
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Deploy nao executado"
            echo "A variavel de repositorio DEPLOY_ENABLED nao e 'true'."
            echo "Configure os servidores e os secrets (ver docs/05-staging-producao.md) para habilitar."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) Deploy STAGING + smoke test completo
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: publish-image
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish-image.outputs.image }}
      smoke-mode: full
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 5) Deploy PRODUCAO (mesma imagem validada em staging; aprovacao manual
  #    configurada no GitHub Environment "production")
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy producao
    needs: [publish-image, deploy-staging]
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish-image.outputs.image }}
      smoke-mode: readonly
    secrets: inherit
