spring.application.name=ecocycle

# -----------------------------------------------------------------------------
# Toda configuracao sensivel ou dependente de ambiente vem de VARIAVEIS DE AMBIENTE.
# Nenhuma senha fica versionada. Veja o arquivo .env.example na raiz do projeto.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8080}

# Banco de Dados Oracle
# Exemplo (Docker Compose): jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# O Oracle pode demorar para aceitar conexoes logo apos subir
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Hibernate/JPA: o Flyway e o dono do schema; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (migrations em src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Em banco novo deve ficar false. So use true para adotar um schema legado ja existente.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# Usuario do Spring Security (Basic Auth) - definido por variavel de ambiente
spring.security.user.name=${APP_SECURITY_USERNAME}
spring.security.user.password=${APP_SECURITY_PASSWORD}

# Actuator: expoe apenas health/info. O health inclui a verificacao do banco (db).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=EcoCycle API
info.app.environment=${APP_ENVIRONMENT:local}
info.app.version=${APP_VERSION:dev}
management.info.env.enabled=true
